# .yaml, потому что в обычный .prettierrc нельзя нормально добавлять комменты

# максимальная длина строки
# в проекте длинные комментарии и строки,
# 80 по дефолту оказалось мало
printWidth: 100

# отступ 4 пробела, как в уже написанном коде
tabWidth: 4

# точка с запятой в конце выражений
semi: true

# двойные кавычки, как в остальном коде
singleQuote: false

# запятая после последнего элемента в многострочных списках
# при добавлении элемента в git меняется только одна строка
trailingComma: all

# скобки у параметра стрелочной функции всегда: (x) => x
arrowParens: always

# окончания строк lf, тк проект должен одинаково работать на Unix и Windows
endOfLine: lf
